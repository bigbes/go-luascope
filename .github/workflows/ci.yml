name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # The dependency check runs weekly, even when nothing is pushed.
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # A linter built with an older Go cannot type-check a newer toolchain.
  GOLANGCI_LINT_VERSION: v2.11.4

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - '1.24'
          - '1.25'
          - stable
    # Pull requests from this repository are already tested by the push run.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: make test
      - name: Cover
        if: matrix.go == 'stable'
        run: make cover
      - name: Upload the coverage profile
        if: matrix.go == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt

  testrace:
    name: testrace
    runs-on: ubuntu-latest
    # The suite takes about 14 minutes with -race -count=100, so the rule
    # timeout-minutes = go test -timeout + 5 leaves room for a slow runner.
    timeout-minutes: 30
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # -count=100 shakes out tests that depend on the order of execution.
      # The default go test timeout of 10 minutes cuts the run short on a
      # loaded runner: the corpus tests of the parser are slow under -race.
      - name: Test with the race detector
        run: go test ./... -race -count=100 -timeout=25m

  lint:
    name: lint
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  spell:
    name: spell
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v4
      - name: Install codespell
        run: pip install codespell
      - name: Check spelling
        run: make spell

  generate:
    name: generate
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check that go generate leaves no diff
        run: |
          go generate ./...
          git diff --exit-code

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Runs on push, on pull requests from forks and on the weekly schedule.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
